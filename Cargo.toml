# The reusable code-intelligence crates now live in their own repository at
# ../codeindex (github: codeindex). decombine consumes them as path
# dependencies below; swap the paths for a git dependency to pin a revision.
[workspace]
members = ["."]
resolver = "3"

[package]
name = "decombine"
version = "0.1.0"
edition = "2024"
description = "Embedding-based detector for non-exact code duplication, concern signals, and project comparison"
publish = false

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
codeindex-core = { path = "../codeindex/crates/core" }
codeindex-embedding = { path = "../codeindex/crates/embedding", default-features = false }
codeindex-indexer = { path = "../codeindex/crates/indexer" }
codeindex-query = { path = "../codeindex/crates/query" }
codeindex-search = { path = "../codeindex/crates/search" }
codeindex-sqlite = { path = "../codeindex/crates/sqlite" }
codeindex-tree-sitter = { path = "../codeindex/crates/tree-sitter" }
globset = "0.4.18"
hex = "0.4.3"
ndarray = "0.17.2"
rayon = "1.12.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
thiserror = "2.0.18"

[features]
default = ["fastembed"]
fastembed = ["codeindex-embedding/fastembed"]
accel = ["fastembed", "codeindex-embedding/accel"]
cuda = ["accel", "codeindex-embedding/cuda"]
directml = ["accel", "codeindex-embedding/directml"]
coreml = ["accel", "codeindex-embedding/coreml"]
openvino = ["accel", "codeindex-embedding/openvino"]
load-dynamic = ["accel", "codeindex-embedding/load-dynamic"]

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
