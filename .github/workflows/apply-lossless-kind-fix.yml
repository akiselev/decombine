name: Apply lossless entity kind mapping

on:
  push:
    branches:
      - agent/extract-code-index-core

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/extract-code-index-core

      - name: Preserve frontend-specific kind spellings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/codeindex-core/src/lib.rs')
          text = path.read_text()
          replacements = {
              '            "type" | "class" | "struct" | "enum" => Self::Type,\n':
                  '            "type" => Self::Type,\n',
              '            "closure" | "lambda" => Self::Closure,\n':
                  '            "closure" => Self::Closure,\n',
              '            "constant" | "const" => Self::Constant,\n':
                  '            "constant" => Self::Constant,\n',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected mapping not found: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cargo fmt --all

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/codeindex-core/src/lib.rs
          git commit -m 'preserve frontend-specific entity kinds'
          git push origin HEAD:agent/extract-code-index-core
