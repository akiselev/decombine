name: Apply shared language catalog

on:
  push:
    branches:
      - agent/extract-code-index-core

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/extract-code-index-core

      - name: Re-export bundled language IDs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/config.rs')
          text = path.read_text()
          start_marker = '/// Language ids bundled with this binary. Kept in sync with the language\n'
          end_marker = '/// Embedding model and execution-provider catalog owned by the reusable backend.\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''/// Language IDs owned by the reusable Tree-sitter frontend.\npub use codeindex_tree_sitter::BUNDLED_LANGUAGE_IDS as KNOWN_LANGUAGE_IDS;\n\n'''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          cargo fmt --all

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/config.rs
          git commit -m 'share bundled language catalog across applications'
          git push origin HEAD:agent/extract-code-index-core
