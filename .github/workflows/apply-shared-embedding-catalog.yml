name: Apply shared embedding catalog

on:
  push:
    branches:
      - agent/extract-code-index-core

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/extract-code-index-core

      - name: Replace decombine model catalog with reusable re-exports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/config.rs')
          text = path.read_text()
          start_marker = '/// Embedding models supported by the fastembed backend, with their output\n'
          end_marker = '#[derive(Debug, thiserror::Error)]\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''/// Embedding model and execution-provider catalog owned by the reusable backend.\npub use codeindex_embedding::config::{\n    EXECUTION_PROVIDERS, MANAGED_MODELS, ManagedFile, ManagedModel, SUPPORTED_MODELS,\n    managed_model,\n};\n\n'''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          cargo fmt --all

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/config.rs
          git commit -m 'share embedding model catalog across applications'
          git push origin HEAD:agent/extract-code-index-core
