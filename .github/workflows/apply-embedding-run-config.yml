name: Apply embedding run configuration

on:
  push:
    branches:
      - agent/extract-code-index-core

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/extract-code-index-core

      - name: Separate model and projection configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/codeindex-embedding/src/embed/mod.rs')
          text = path.read_text()
          text = text.replace(
              'use crate::config::Config;\n',
              'use crate::config::{EmbeddingConfig, EmbeddingRunConfig};\n',
              1,
          )
          old = '''pub fn embedder_from_config(config: &Config) -> Result<Box<dyn Embedder>> {\n    match config.embedding.backend.as_str() {\n        #[cfg(feature = "fastembed")]\n        "fastembed" => Ok(Box::new(fastembed_backend::FastembedBackend::new(\n            &config.embedding,\n        )?)),\n'''
          new = '''pub fn embedder_from_config(config: &EmbeddingConfig) -> Result<Box<dyn Embedder>> {\n    match config.backend.as_str() {\n        #[cfg(feature = "fastembed")]\n        "fastembed" => Ok(Box::new(fastembed_backend::FastembedBackend::new(config)?)),\n'''
          if old not in text:
              raise SystemExit('embedder_from_config block not found')
          text = text.replace(old, new, 1)
          text = text.replace('config: &Config', 'config: &EmbeddingRunConfig')
          text = text.replace(
              'config.analysis.body_node_count_threshold',
              'config.source_recovery.body_node_count_threshold',
          )
          text = text.replace(
              'Accelerator execution providers decombine can request',
              'Accelerator execution providers the local backend can request',
          )
          path.write_text(text)
          PY
          cargo fmt --all

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/codeindex-embedding/src/embed/mod.rs
          git commit -m 'separate embedding model and run configuration'
          git push origin HEAD:agent/extract-code-index-core
