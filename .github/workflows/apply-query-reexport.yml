name: Apply query compatibility re-export

on:
  push:
    branches:
      - agent/extract-code-index-core

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/extract-code-index-core

      - name: Re-export stable query helpers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/query/mod.rs')
          text = path.read_text()
          old = 'use codeindex_query::{UnitView, WhereFilter, identity_diff, rank_candidates, unit_id, unit_line};\n'
          new = 'pub use codeindex_query::{unit_id, unit_line};\nuse codeindex_query::{UnitView, WhereFilter, identity_diff, rank_candidates};\n'
          if old not in text:
              raise SystemExit('expected query import not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/query/mod.rs
          git commit -m 'preserve query helper re-exports'
          git push origin HEAD:agent/extract-code-index-core
